name: CloudBase Docs

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: cloudbase-docs-${{ github.ref }}
    cancel-in-progress: false

jobs:
    docs:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  package-manager-cache: false

            - name: Install pnpm
              run: npm install --global pnpm@10.18.3

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run tests
              run: |
                  node --test scripts/deploy-cloudbase.test.mjs
                  pnpm test:run

            - name: Build documentation
              run: pnpm docs:build

            - name: Login to CloudBase
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              env:
                  TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
                  TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
              run: |
                  npm install --global @cloudbase/cli@3.8.7

                  tcb login \
                    --apiKeyId "$TCB_SECRET_ID" \
                    --apiKey "$TCB_SECRET_KEY"

            - name: Deploy to CloudBase
              if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
              env:
                  TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
              # CloudBase checks out main and publishes it in China,
              # avoiding a large ZIP upload from the GitHub-hosted runner.
              run: node scripts/deploy-cloudbase.mjs
